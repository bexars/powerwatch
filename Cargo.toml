[package]
name = "powerwatch"
version = "0.1.0"
edition = "2024"
description = "Watch OS power and session events without a GUI event loop"
repository = "https://github.com/bradbury/powermonitor"
readme = "README.md"
keywords = ["power", "sleep", "suspend", "session"]
categories = ["os"]

[dependencies]
flume = { version = "0.11", default-features = false, features = ["async"] }
futures-core = { version = "0.3", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.1"
dispatch2 = { version = "0.3.1", features = ["block2"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "pwr_mgt",
    "dispatch2",
] }
